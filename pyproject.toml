[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "fetchkeel"
dynamic = ["version"]
description = "Blazing-fast, agent-first (DX + AX) Rust declarative REST API extractor with Link/cursor/page pagination, rate-limit backoff, and incremental watermarks."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
requires-python = ">=3.9"
keywords = ["etl", "rest-api", "pagination", "jsonl", "extraction", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/robertguss/fetchkeel"
Repository = "https://github.com/robertguss/fetchkeel"
Issues = "https://github.com/robertguss/fetchkeel/issues"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
strip = true
